[project]
name = "equipment-claims-mcp"
version = "0.1.0"
description = "MCP server and ReAct agent for IT equipment requests."
requires-python = ">=3.10"
dependencies = ["mcp==2.2.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
